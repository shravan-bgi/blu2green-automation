name: E2E Tests

# Runs against a shared, always-on demo environment. Nothing to build or start.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:00 UTC — the shared environment is quietest.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Declared once so no job is missed. No login credentials here: the fixture
# account is test data and lives in data/auth.json.
env:
  CI: true
  DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
  DEMO_DB_HOST: ${{ secrets.DEMO_DB_HOST }}
  DEMO_DB_PORT: ${{ secrets.DEMO_DB_PORT }}
  DEMO_DB_NAME: ${{ secrets.DEMO_DB_NAME }}
  DEMO_DB_USER: ${{ secrets.DEMO_DB_USER }}
  DEMO_DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}

jobs:
  # Tier 1 — every trigger. Cheap, and it gates the expensive jobs below.
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Tier 2 — pull requests. Smoke only, so PR feedback stays inside the window a
  # reviewer will actually wait for.
  smoke:
    name: Smoke (chromium)
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # --pass-with-no-tests: @smoke may match nothing while the suite is young.
      - name: Run smoke tests
        run: >-
          npx playwright test
          --project=chromium
          --grep @smoke
          --grep-invert @quarantine
          --shard=${{ matrix.shard }}/3
          --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-smoke-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # Tier 3 — merge to main, nightly, and on demand. The whole suite.
  full:
    name: Full suite (chromium)
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # --fail-on-flaky-tests here but not on smoke: a retry-pass is still broken,
      # but it should not block someone else's review.
      - name: Run full suite
        run: >-
          npx playwright test
          --project=chromium
          --grep-invert @quarantine
          --shard=${{ matrix.shard }}/3
          --fail-on-flaky-tests
          --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-full-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-full-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # Tier 4 — nightly only. Slow, and rarely find what chromium misses.
  cross-browser:
    name: Cross-browser (${{ matrix.project }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          browsers: firefox webkit

      - name: Run full suite
        run: >-
          npx playwright test
          --project=${{ matrix.project }}
          --grep-invert @quarantine
          --fail-on-flaky-tests
          --pass-with-no-tests

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

  # Runs everywhere, blocks nothing, so unstable tests stay visible.
  quarantine:
    name: Quarantined tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run quarantined tests
        id: quarantined
        run: >-
          npx playwright test
          --project=chromium
          --grep @quarantine
          --pass-with-no-tests

      - name: Flag the failure without blocking
        if: failure()
        run: echo "::warning::Quarantined tests failed. Fix the root cause or remove the test."

  report:
    name: Merge reports
    needs: [static, smoke, full, cross-browser, quarantine]
    # !cancelled() tolerates the tiers this trigger skipped. The static check is
    # separate: if it failed, there is nothing to report on.
    if: ${{ !cancelled() && needs.static.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      flaky: ${{ steps.counts.outputs.flaky }}
      skipped: ${{ steps.counts.outputs.skipped }}
      total: ${{ steps.counts.outputs.total }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      # Counts come from the merged report, so they span every shard rather than
      # whichever one happened to finish last. Non-blocking: a missing or
      # unparseable report yields zeroes, which the email reads as "no tests ran"
      # — the honest answer when the suite died before starting.
      - name: Count test results
        id: counts
        continue-on-error: true
        run: |
          set -uo pipefail
          P=0; F=0; K=0; S=0
          if [ -f merged-report.json ]; then
            read -r P F K S < <(jq -r \
              '[.stats.expected, .stats.unexpected, .stats.flaky, .stats.skipped] | @tsv' \
              merged-report.json)
          fi
          {
            echo "passed=$P"
            echo "failed=$F"
            echo "flaky=$K"
            echo "skipped=$S"
            echo "total=$((P + F + K + S))"
          } >> "$GITHUB_OUTPUT"
          echo "Merged totals: $P passed, $F failed, $K flaky, $S skipped"

      - name: Download Allure results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Trends need history carried between runs; Allure 3 keeps it in one file.
      - name: Restore Allure history
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-history
          path: .allure

      # mkdir guard: allure generate errors on a missing input directory.
      - name: Generate Allure report
        run: |
          mkdir -p allure-results
          npx allure generate allure-results

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Allure history
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-history
          path: .allure/
          retention-days: 90
          overwrite: true

      - name: Upload merged Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Scheduled and manual runs only. GitHub's own notification already covers push
  # and PR, and covers them better — but it goes to whoever triggered a run, and
  # a cron has no trigger, so it falls back to whoever last edited this file.
  # A daily readiness alert needs a deliberate recipient, not an incidental one.
  notify-failure:
    name: Email on failure
    # `quarantine` absent on purpose: non-blocking, so its failures are expected.
    needs: [static, smoke, full, cross-browser, report]
    # `contains` rather than `failure()`: most triggers skip tiers, and
    # `failure()` cannot tell skipped from failed.
    if: >-
      ${{ always() && contains(needs.*.result, 'failure')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Built in shell rather than inline in `with:` — one row function beats the
      # same status conditional written out five times, and the same generator
      # serves a success email if one is ever added.
      #
      # Tables and inline styles are not stylistic. This mail is read in Windows
      # Live Mail, which renders through the Word engine: no flexbox, no grid,
      # <style> blocks stripped, images blocked. Anything cleverer degrades to
      # worse than plain text.
      - name: Build the email body
        id: mail
        env:
          # Passed through env, never interpolated into the script, so nothing
          # from the run context reaches the shell directly.
          R_STATIC: ${{ needs.static.result }}
          R_SMOKE: ${{ needs.smoke.result }}
          R_FULL: ${{ needs.full.result }}
          R_CROSS: ${{ needs['cross-browser'].result }}
          R_REPORT: ${{ needs.report.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          T_PASSED: ${{ needs.report.outputs.passed }}
          T_FAILED: ${{ needs.report.outputs.failed }}
          T_FLAKY: ${{ needs.report.outputs.flaky }}
          T_SKIPPED: ${{ needs.report.outputs.skipped }}
          T_TOTAL: ${{ needs.report.outputs.total }}
        run: |
          set -euo pipefail

          # Empty when the report job was skipped or its count step failed.
          T_PASSED=${T_PASSED:-0}; T_FAILED=${T_FAILED:-0}
          T_FLAKY=${T_FLAKY:-0};   T_SKIPPED=${T_SKIPPED:-0}
          T_TOTAL=${T_TOTAL:-0}

          FAILED=0
          for r in "$R_STATIC" "$R_SMOKE" "$R_FULL" "$R_CROSS" "$R_REPORT"; do
            [ "$r" = "failure" ] && FAILED=$((FAILED + 1))
          done

          # Zero tests is a different failure from failing tests: the suite died
          # before running anything — a config, install or environment problem.
          # The subject says which, because that decides who looks at it.
          if [ "$T_TOTAL" -eq 0 ]; then
            HEADLINE="No tests ran"
            SUBJECT="[blu2green] E2E FAILED on $BRANCH — no tests ran"
            SUMMARY="The suite failed before running anything. Usually a config, dependency or environment problem rather than a broken test."
          else
            HEADLINE="$T_FAILED of $T_TOTAL tests failed"
            SUBJECT="[blu2green] E2E FAILED on $BRANCH — $T_FAILED of $T_TOTAL tests"
            SUMMARY="<b style=\"color:#b3261e\">$T_FAILED failed</b> &middot; $T_PASSED passed &middot; $T_FLAKY flaky &middot; $T_SKIPPED skipped"
          fi

          row() {
            case "$2" in
              success)   glyph="&#10003;"; colour="#1e6f3c"; label="passed" ;;
              failure)   glyph="&#10007;"; colour="#b3261e"; label="FAILED" ;;
              cancelled) glyph="&#9210;";  colour="#8a6d00"; label="cancelled" ;;
              *)         glyph="&#8211;";  colour="#9aa0a6"; label="not run" ;;
            esac
            printf '<tr><td style="padding:9px 20px;border-top:1px solid #ececec;font-family:Arial,sans-serif;font-size:14px;color:#202124">%s</td><td align="right" style="padding:9px 20px;border-top:1px solid #ececec;font-family:Arial,sans-serif;font-size:14px;color:%s;white-space:nowrap">%s&nbsp;%s</td></tr>' "$1" "$colour" "$glyph" "$label"
          }

          {
            echo 'html<<HTML_BODY_EOF'
            cat <<HTML
          <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f4f5"><tr><td align="center" style="padding:24px 12px">
          <table width="600" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="border:1px solid #e0e0e0">

          <tr><td bgcolor="#b3261e" style="padding:18px 20px;font-family:Arial,sans-serif;font-size:19px;font-weight:bold;color:#ffffff">
          &#10007;&nbsp; $HEADLINE
          </td></tr>

          <tr><td style="padding:16px 20px 2px;font-family:Arial,sans-serif;font-size:15px;color:#5f6368">
          $SUMMARY
          </td></tr>

          <tr><td style="padding:6px 20px 2px;font-family:Arial,sans-serif;font-size:13px;color:#9aa0a6">
          <b style="color:#5f6368">$BRANCH</b> &middot; $TRIGGER &middot; $FAILED of 5 jobs failed
          </td></tr>

          <tr><td style="padding:16px 20px 18px">
          <table cellpadding="0" cellspacing="0"><tr><td bgcolor="#1a73e8" style="padding:11px 22px">
          <a href="$RUN_URL" style="font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none">View the run &rarr;</a>
          </td></tr></table>
          </td></tr>

          <tr><td style="padding:0 0 4px">
          <table width="100%" cellpadding="0" cellspacing="0">
          $(row "Typecheck and lint" "$R_STATIC")
          $(row "Smoke" "$R_SMOKE")
          $(row "Full suite" "$R_FULL")
          $(row "Cross-browser" "$R_CROSS")
          $(row "Merge reports" "$R_REPORT")
          </table>
          </td></tr>

          <tr><td style="padding:16px 20px;border-top:1px solid #ececec;font-family:Arial,sans-serif;font-size:13px;line-height:20px;color:#5f6368">
          Commit <span style="font-family:Consolas,monospace;color:#202124">${COMMIT:0:12}</span> by $ACTOR<br>
          Traces, screenshots, video and the Allure report are attached to the run as artifacts.<br>
          <span style="color:#9aa0a6">&#8211;&nbsp;not run is normal: each trigger runs only its own tier.</span>
          </td></tr>

          </table></td></tr></table>
          HTML
            echo 'HTML_BODY_EOF'
            echo "subject=$SUBJECT"
            echo "headline=$HEADLINE"
          } >> "$GITHUB_OUTPUT"

      # Skipped until the SMTP secrets exist. `secrets` is unavailable in a
      # job-level `if`, hence env.
      - name: Send the failure email
        if: ${{ env.MAIL_SERVER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: blu2green CI <${{ secrets.MAIL_USERNAME }}>
          to: shravan@businessgateways.com
          # Built in the same step as the body, so the two cannot drift apart.
          subject: ${{ steps.mail.outputs.subject }}
          html_body: ${{ steps.mail.outputs.html }}
          # Plain-text alternative, for clients that refuse HTML outright.
          body: |
            E2E suite failed — ${{ steps.mail.outputs.headline }}.

            Tests   ${{ needs.report.outputs.failed }} failed, ${{ needs.report.outputs.passed }} passed, ${{ needs.report.outputs.flaky }} flaky, ${{ needs.report.outputs.skipped }} skipped

            Run     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Branch  ${{ github.head_ref || github.ref_name }}
            Commit  ${{ github.event.pull_request.head.sha || github.sha }}
            Trigger ${{ github.event_name }} by ${{ github.actor }}

            Typecheck and lint   ${{ needs.static.result }}
            Smoke                ${{ needs.smoke.result }}
            Full suite           ${{ needs.full.result }}
            Cross-browser        ${{ needs['cross-browser'].result }}
            Merge reports        ${{ needs.report.result }}

            Traces, video and the Allure report are attached to the run.
