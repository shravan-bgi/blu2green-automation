name: E2E Tests

# A push borrows its commit message for the run name and a pull request its title,
# but a schedule and a dispatch have neither, so both fall back to the workflow's
# own name — which is why every nightly sits in the run list as another
# indistinguishable row reading "E2E Tests".
#
# Empty for push and pull_request on purpose: a whitespace-only `run-name` is
# documented to fall back to the event's own default, and the commit subject is a
# better name than anything that could be spelled out here. Borrowing the message
# instead would be worse than the default rather than better — the default takes
# the subject line, while `head_commit.message` is the whole body, and the commit
# subjects in this repository run to several paragraphs.
#
# Named by what the tier is rather than which browsers are in it, so the matrix
# can change without leaving a lie in the run list.
run-name: >-
  ${{ (github.event_name == 'schedule' && 'Nightly · full suite + cross-browser')
  || (github.event_name == 'workflow_dispatch' && format('Manual · {0} · @{1}', github.ref_name, github.actor))
  || '' }}

# Runs against a shared, always-on demo environment. Nothing to build or start.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:00 UTC — the shared environment is quietest.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Declared once so no job is missed. No login credentials here: the fixture
# account is test data and lives in data/auth.json.
env:
  CI: true
  DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
  DEMO_DB_HOST: ${{ secrets.DEMO_DB_HOST }}
  DEMO_DB_PORT: ${{ secrets.DEMO_DB_PORT }}
  DEMO_DB_NAME: ${{ secrets.DEMO_DB_NAME }}
  DEMO_DB_USER: ${{ secrets.DEMO_DB_USER }}
  DEMO_DB_PASSWORD: ${{ secrets.DEMO_DB_PASSWORD }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}

jobs:
  # Tier 1 — every trigger. Cheap, and it gates the expensive jobs below.
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Tier 2 — pull requests. Smoke only, so PR feedback stays inside the window a
  # reviewer will actually wait for.
  smoke:
    name: Smoke (chromium + api)
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # --pass-with-no-tests: @smoke may match nothing while the suite is young.
      - name: Run smoke tests
        run: >-
          npx playwright test
          --project=chromium
          --project=api
          --grep @smoke
          --grep-invert @quarantine
          --shard=${{ matrix.shard }}/3
          --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-smoke-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # Tier 3 — merge to main, nightly, and on demand. The whole suite.
  full:
    name: Full suite (chromium + api)
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # --fail-on-flaky-tests here but not on smoke: a retry-pass is still broken,
      # but it should not block someone else's review.
      - name: Run full suite
        run: >-
          npx playwright test
          --project=chromium
          --project=api
          --grep-invert @quarantine
          --shard=${{ matrix.shard }}/3
          --fail-on-flaky-tests
          --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-full-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-full-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # Tier 4 — nightly only. Slow, and rarely find what chromium misses.
  cross-browser:
    name: Cross-browser (${{ matrix.project }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          browsers: firefox webkit

      - name: Run full suite
        run: >-
          npx playwright test
          --project=${{ matrix.project }}
          --grep-invert @quarantine
          --fail-on-flaky-tests
          --pass-with-no-tests

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

  # Runs everywhere, blocks nothing, so unstable tests stay visible.
  quarantine:
    name: Quarantined tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run quarantined tests
        id: quarantined
        run: >-
          npx playwright test
          --project=chromium
          --project=api
          --grep @quarantine
          --pass-with-no-tests

      - name: Flag the failure without blocking
        if: failure()
        run: echo "::warning::Quarantined tests failed. Fix the root cause or remove the test."

  report:
    name: Merge reports
    needs: [static, smoke, full, cross-browser, quarantine]
    # !cancelled() tolerates the tiers this trigger skipped. The static check is
    # separate: if it failed, there is nothing to report on.
    if: ${{ !cancelled() && needs.static.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      flaky: ${{ steps.counts.outputs.flaky }}
      skipped: ${{ steps.counts.outputs.skipped }}
      total: ${{ steps.counts.outputs.total }}
      duration: ${{ steps.counts.outputs.duration }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      # Counts come from the merged report, so they span every shard rather than
      # whichever one happened to finish last. Non-blocking: a missing or
      # unparseable report yields zeroes, which the email reads as "no tests ran"
      # — the honest answer when the suite died before starting.
      - name: Count test results
        id: counts
        continue-on-error: true
        run: |
          set -uo pipefail
          P=0; F=0; K=0; S=0; MS=0
          if [ -f merged-report.json ]; then
            read -r P F K S MS < <(jq -r \
              '[.stats.expected, .stats.unexpected, .stats.flaky, .stats.skipped,
                (.stats.duration // 0 | floor)] | @tsv' merged-report.json)
          fi
          SECS=$((MS / 1000))
          if [ "$SECS" -ge 60 ]; then
            HUMAN="$((SECS / 60))m $((SECS % 60))s"
          else
            HUMAN="${SECS}s"
          fi
          {
            echo "passed=$P"
            echo "failed=$F"
            echo "flaky=$K"
            echo "skipped=$S"
            echo "total=$((P + F + K + S))"
            echo "duration=$HUMAN"
          } >> "$GITHUB_OUTPUT"
          echo "Merged totals: $P passed, $F failed, $K flaky, $S skipped in $HUMAN"

      - name: Download Allure results
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Trends need history carried between runs; Allure 3 keeps it in one file.
      - name: Restore Allure history
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-history
          path: .allure

      # mkdir guard: allure generate errors on a missing input directory.
      - name: Generate Allure report
        run: |
          mkdir -p allure-results
          npx allure generate allure-results

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # A second, self-contained build of the same results. The report above is a
      # directory of files that fetch each other, so downloading it gets you
      # something that only opens behind a web server. This one is a single HTML
      # file that anyone can download and double-click — no checkout, no Node, no
      # npm — which is what makes it the thing to send to someone outside the team.
      # Through the npm script rather than the CLI, so the file arrives named
      # blu2green-e2e-<date>.html. Whoever downloads this unzips it onto a
      # desktop, and "index.html" is not a name anyone can find again.
      - name: Generate the shareable single-file report
        if: ${{ !cancelled() }}
        run: npm run allure:share

      - name: Upload the shareable report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-single-file
          path: allure-share/blu2green-e2e-*.html
          retention-days: 30

      - name: Upload Allure history
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-history
          path: .allure/
          retention-days: 90
          overwrite: true

      - name: Upload merged Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Scheduled and manual runs only, pass or fail. GitHub's own notification
  # already covers push and PR, and covers them better — but it goes to whoever
  # triggered a run, and a cron has no trigger, so it falls back to whoever last
  # edited this file. A daily readiness alert needs a deliberate recipient, not
  # an incidental one.
  #
  # It has to arrive on a green night too. GitHub mails nothing whatsoever when a
  # run passes, so an empty inbox means either "the suite is green" or "the cron
  # never fired", and nothing distinguishes the two. One mail a night either way
  # is what makes a missing one worth noticing.
  notify:
    name: Email the result
    # `quarantine` absent on purpose: non-blocking, so its failures are expected.
    needs: [static, smoke, full, cross-browser, report]
    # No `contains(needs.*.result, 'failure')` gate any more: a passing run has to
    # reach this job as well, so which mail to send — or whether to send one at
    # all — is decided in the step below, where skipped, cancelled and failed can
    # be told apart. `always()`, or a failure in any tier would skip the very job
    # that reports it.
    if: >-
      ${{ always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both bodies are built in shell rather than inline in `with:` — one row
      # function beats the same status conditional written out five times, and a
      # `${{ }}` expression cannot see which outcome the shell decided on.
      #
      # Tables and inline styles are not stylistic. This mail is read in Windows
      # Live Mail, which renders through the Word engine: no flexbox, no grid,
      # <style> blocks stripped, images blocked. Anything cleverer degrades to
      # worse than plain text.
      - name: Build the email body
        id: mail
        env:
          # Passed through env, never interpolated into the script, so nothing
          # from the run context reaches the shell directly.
          R_STATIC: ${{ needs.static.result }}
          R_SMOKE: ${{ needs.smoke.result }}
          R_FULL: ${{ needs.full.result }}
          R_CROSS: ${{ needs['cross-browser'].result }}
          R_REPORT: ${{ needs.report.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          T_PASSED: ${{ needs.report.outputs.passed }}
          T_FAILED: ${{ needs.report.outputs.failed }}
          T_FLAKY: ${{ needs.report.outputs.flaky }}
          T_SKIPPED: ${{ needs.report.outputs.skipped }}
          T_TOTAL: ${{ needs.report.outputs.total }}
          T_DURATION: ${{ needs.report.outputs.duration }}
        run: |
          set -euo pipefail

          # Empty whenever the report job did not finish.
          T_PASSED=${T_PASSED:-0}; T_FAILED=${T_FAILED:-0}
          T_FLAKY=${T_FLAKY:-0};   T_SKIPPED=${T_SKIPPED:-0}
          T_TOTAL=${T_TOTAL:-0};   T_DURATION=${T_DURATION:-unknown}

          # Read off the tier results rather than the workflow's own status: most
          # triggers skip whole tiers, and neither success() nor failure() can
          # tell a skipped tier from a broken one.
          ANY_FAILED=false
          ANY_CANCELLED=false
          for r in "$R_STATIC" "$R_SMOKE" "$R_FULL" "$R_CROSS" "$R_REPORT"; do
            case "$r" in
              failure)   ANY_FAILED=true ;;
              cancelled) ANY_CANCELLED=true ;;
            esac
          done

          # Nothing broke, but nothing was counted either: the run was called off,
          # or a newer one replaced it. A green mail with no numbers behind it
          # would claim more than is known, and whoever stopped the run already
          # knows they did — so this is the one outcome that sends no mail at all.
          # A failure outranks it: a tier that broke before the run was called off
          # is still the news, which is why this is reached only when none did.
          if [ "$ANY_FAILED" = false ]; then
            if [ "$ANY_CANCELLED" = true ] || [ "$R_REPORT" != "success" ]; then
              echo "send=false" >> "$GITHUB_OUTPUT"
              echo "Nothing failed, and no results were collected. No mail sent."
              exit 0
            fi
          fi

          # One fixed shape, pass or fail. A predictable subject is what inbox
          # rules and sorting depend on, and at 33 characters it survives a phone
          # preview with the status word still visible. ASCII only: subject
          # headers are MIME-encoded and older clients render a stray middle dot
          # as a question mark.
          if [ "$ANY_FAILED" = true ]; then
            SUBJECT="[blu2green] Commit ${COMMIT:0:7} Failed"
          else
            SUBJECT="[blu2green] Commit ${COMMIT:0:7} Passed"
          fi

          # Traces, screenshots and video are `on-first-retry` in CI, so a run
          # that passed first time leaves none. Promising them in a green mail
          # sends the reader hunting for artifacts that were never recorded.
          FAIL_NOTE="Traces, screenshots, video and the Allure report are attached to the run as artifacts."
          PASS_NOTE="The Allure report is attached to the run as an artifact. A run that passed first time records no traces, screenshots or video."

          if [ "$ANY_FAILED" = true ]; then
            BANNER="#b3261e"
            ARTIFACTS="$FAIL_NOTE"
            # Which kind of failure it was lives in the headline. Three different
            # stories, and conflating them misleads: counts exist only once the
            # report job finishes, so if it was cancelled tests may well have run
            # and failed, and "no tests ran" would be wrong rather than merely
            # vague.
            if [ "$R_REPORT" != "success" ]; then
              HEADLINE="Test results unavailable"
              SUMMARY="The reporting step did not finish, so per-test counts could not be collected. Open the run to see what happened."
            elif [ "$T_TOTAL" -eq 0 ]; then
              HEADLINE="No tests ran"
              SUMMARY="The suite failed before running anything &mdash; usually a config, dependency or environment fault rather than a broken test."
            else
              HEADLINE="$T_FAILED of $T_TOTAL tests failed"
              SUMMARY="<span style=\"color:#b3261e;font-weight:bold\">$T_FAILED failed</span> &nbsp;&middot;&nbsp; $T_PASSED passed &nbsp;&middot;&nbsp; $T_FLAKY flaky &nbsp;&middot;&nbsp; $T_SKIPPED skipped &nbsp;&middot;&nbsp; $T_DURATION"
            fi
          elif [ "$T_TOTAL" -eq 0 ]; then
            # Every job green with nothing to show for it. `--pass-with-no-tests`
            # is deliberate — a tag can legitimately match nothing while the suite
            # is young — but a green banner over zero tests is the one thing a
            # pass mail must never say, so this one goes out amber.
            BANNER="#8a6d00"
            ARTIFACTS="$PASS_NOTE"
            HEADLINE="No tests ran"
            SUMMARY="Every job passed, but the run contained no tests. Check the tag filters before reading this as a green suite."
          else
            BANNER="#1e6f3c"
            ARTIFACTS="$PASS_NOTE"
            HEADLINE="All $T_PASSED tests passed"
            SUMMARY="<span style=\"color:#1e6f3c;font-weight:bold\">$T_PASSED passed</span> &nbsp;&middot;&nbsp; $T_FAILED failed &nbsp;&middot;&nbsp; $T_FLAKY flaky &nbsp;&middot;&nbsp; $T_SKIPPED skipped &nbsp;&middot;&nbsp; $T_DURATION"
          fi

          row() {
            case "$2" in
              success)   colour="#1e6f3c"; label="passed" ;;
              failure)   colour="#b3261e"; label="FAILED" ;;
              cancelled) colour="#8a6d00"; label="cancelled" ;;
              *)         colour="#9aa0a6"; label="not run" ;;
            esac
            printf '<tr><td style="padding:10px 24px;border-top:1px solid #eceff1;font-family:Arial,sans-serif;font-size:14px;color:#263238">%s</td><td align="right" style="padding:10px 24px;border-top:1px solid #eceff1;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;color:%s;white-space:nowrap">%s</td></tr>' "$1" "$colour" "$label"
          }

          detail() {
            printf '<tr><td width="90" style="padding:3px 24px 3px 0;font-family:Arial,sans-serif;font-size:13px;color:#90a4ae">%s</td><td style="padding:3px 0;font-family:Arial,sans-serif;font-size:13px;color:#37474f">%s</td></tr>' "$1" "$2"
          }

          {
            echo 'html<<HTML_BODY_EOF'
            cat <<HTML
          <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eceff1"><tr><td align="center" style="padding:28px 12px">
          <table width="620" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border:1px solid #cfd8dc">

          <tr><td bgcolor="#263238" style="padding:16px 24px;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;letter-spacing:0.5px">
          blu2green <span style="color:#8ec640">&#183;</span> <span style="font-weight:normal;color:#b0bec5">E2E Automation</span>
          </td></tr>

          <tr><td bgcolor="$BANNER" style="padding:20px 24px;font-family:Arial,sans-serif;font-size:21px;font-weight:bold;color:#ffffff">
          $HEADLINE
          </td></tr>

          <tr><td style="padding:18px 24px 0;font-family:Arial,sans-serif;font-size:14px;line-height:22px;color:#546e7a">
          $SUMMARY
          </td></tr>

          <tr><td style="padding:20px 24px 22px">
          <table cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#1a73e8" style="padding:12px 26px">
          <a href="$RUN_URL" style="font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none">View the run &nbsp;&rarr;</a>
          </td></tr></table>
          </td></tr>

          <tr><td bgcolor="#f5f7f8" style="padding:9px 24px;border-top:1px solid #cfd8dc;border-bottom:1px solid #cfd8dc;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;letter-spacing:1px;color:#607d8b">
          PIPELINE
          </td></tr>

          <tr><td style="padding:0">
          <table width="100%" cellpadding="0" cellspacing="0" border="0">
          $(row "Typecheck and lint" "$R_STATIC")
          $(row "Smoke" "$R_SMOKE")
          $(row "Full suite" "$R_FULL")
          $(row "Cross-browser" "$R_CROSS")
          $(row "Merge reports" "$R_REPORT")
          </table>
          </td></tr>

          <tr><td bgcolor="#f5f7f8" style="padding:9px 24px;border-top:1px solid #cfd8dc;border-bottom:1px solid #cfd8dc;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;letter-spacing:1px;color:#607d8b">
          DETAILS
          </td></tr>

          <tr><td style="padding:14px 24px 16px">
          <table cellpadding="0" cellspacing="0" border="0">
          $(detail "Branch" "<b>$BRANCH</b>")
          $(detail "Commit" "<span style=\"font-family:Consolas,monospace\">${COMMIT:0:12}</span>")
          $(detail "Trigger" "$TRIGGER, by $ACTOR")
          $(detail "Run" "#$RUN_NUMBER")
          $(detail "Duration" "$T_DURATION")
          </table>
          </td></tr>

          <tr><td style="padding:0 24px 18px;font-family:Arial,sans-serif;font-size:13px;line-height:20px;color:#607d8b">
          $ARTIFACTS<br>
          <span style="color:#b0bec5">&ldquo;not run&rdquo; is normal &mdash; each trigger runs only its own tier.</span>
          </td></tr>

          <tr><td bgcolor="#f5f7f8" style="padding:14px 24px;border-top:1px solid #cfd8dc;font-family:Arial,sans-serif;font-size:12px;line-height:18px;color:#90a4ae">
          Automated message from the blu2green E2E pipeline. Replies are not monitored.<br>
          <a href="$REPO_URL" style="color:#607d8b;text-decoration:none">$REPO</a>
          </td></tr>

          </table></td></tr></table>
          HTML
            echo 'HTML_BODY_EOF'
            echo 'text<<TEXT_BODY_EOF'
            cat <<TEXT
          blu2green - E2E Automation
          $HEADLINE

          Tests     $T_FAILED failed, $T_PASSED passed, $T_FLAKY flaky, $T_SKIPPED skipped
          Duration  $T_DURATION

          Run       $RUN_URL

          PIPELINE
            Typecheck and lint   $R_STATIC
            Smoke                $R_SMOKE
            Full suite           $R_FULL
            Cross-browser        $R_CROSS
            Merge reports        $R_REPORT

          DETAILS
            Branch    $BRANCH
            Commit    $COMMIT
            Trigger   $TRIGGER, by $ACTOR
            Run       #$RUN_NUMBER

          $ARTIFACTS

          Automated message from the blu2green E2E pipeline. Replies are not monitored.
          $REPO_URL
          TEXT
            echo 'TEXT_BODY_EOF'
            echo "subject=$SUBJECT"
            echo "send=true"
          } >> "$GITHUB_OUTPUT"

      # Skipped until the SMTP secrets exist. `secrets` is unavailable in a
      # job-level `if`, hence env. `send` is what the step above sets to false
      # when an interrupted run left nothing worth reporting.
      - name: Send the result email
        if: ${{ env.MAIL_SERVER != '' && steps.mail.outputs.send == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: blu2green CI <${{ secrets.MAIL_USERNAME }}>
          to: shravan@businessgateways.com
          # Subject and both bodies come out of the one step above, so none of the
          # three can drift from the outcome the other two describe. The
          # plain-text body is the alternative for clients that refuse HTML
          # outright; it used to be written out here in `${{ }}` expressions,
          # which cannot see which branch the shell took and so could only ever
          # describe a failure.
          subject: ${{ steps.mail.outputs.subject }}
